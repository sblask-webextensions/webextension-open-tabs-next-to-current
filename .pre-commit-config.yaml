repos:

  - repo: local
    hooks:

      - id: eslint
        name: eslint
        entry: npx eslint --no-warn-ignored
        language: system
        types_or:
          - javascript

      - id: prepare-chrome check
        name: Check prepare-chrome script works
        entry: bash -c "./bin/prepare-chrome.sh 0.0.0"
        language: system
        pass_filenames: false

      - id: web-ext lint
        name: web-ext lint
        entry: bash -c "./bin/prepare-firefox.sh 0.0.0 && npx web-ext lint --source-dir dist-firefox/"
        language: system
        pass_filenames: false

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.1
    hooks:
      - id: editorconfig-checker
        exclude: \.fodg$
